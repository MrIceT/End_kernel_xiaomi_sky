name: Droidspaces Arrow Gclang

on:
  workflow_dispatch:

env:
  KERNEL_SOURCE: "https://github.com/sky-lineage/android_kernel_xiaomi_sky"
  KERNEL_BRANCH: "lineage-23.2" # Change to your target branch
  DEFCONFIG: "gki_defconfig"   # Pure GKI builds usually use gki_defconfig
  ARCH: "arm64"

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Actions Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git python3 python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev cpio lz4 zip \
            make wget ccache

      - name: Checkout Actions Repo
        uses: actions/checkout@v4

      # 1. Delete Microsoft, Android, and Java bloatware to free up ~30GB of disk space
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # 2. Now you safely have plenty of room to allocate a massive 20GB Swap file
      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 20

      # Clone the kernel repo
      - name: Clone Kernel Source
        run: |
          # git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_SOURCE }} kernel_workspace
          git clone --depth=1 -b lineage-23.2 https://github.com/MrIceT/android_kernel_xiaomi_sky.git kernel_workspace
          git clone --depth=1 https://github.com/MrIceT/droidspaces_oss_kernel droidspaces 


      - name: Download Toolchains (Google Clang)
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain/
          wget -qO google-clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/f8439f0628d799092dd07df440a6334cab28939c/clang-r563880c.tar.gz"
          tar -xf google-clang.tar.gz 
          rm google-clang.tar.gz
          
          echo "=== Setting PATH Variables ==="
          # echo "PATH=$GITHUB_WORKSPACE/toolchain/neutron-clang/bin:$GITHUB_WORKSPACE/toolchain/gcc-aarch64/bin:$PATH" >> $GITHUB_ENV
          echo "PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH" >> $GITHUB_ENV


      - name: Integrate Droidspaces
        run: |
          echo "=== 1. Integrating droidspaces ==="
          cd $GITHUB_WORKSPACE/droidspaces
          cp * $GITHUB_WORKSPACE/kernel_workspace
          cd $GITHUB_WORKSPACE/kernel_workspace
          rm arch/arm64/configs/gki_defconfig
          mv gki_defconfig arch/arm64/configs/gki_defconfig
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          patch -p1 < 002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch

      - name: Compile Kernel (Image)
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          ARGS="O=out ARCH=${{ env.ARCH }} \
                CC=clang \
                CROSS_COMPILE=aarch64-none-linux-gnu- \
                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                LLVM=1 LLVM_IAS=1" 

          CUSTOM_NAME="-ds"
         
          make $ARGS LOCALVERSION=$CUSTOM_NAME ${{ env.DEFCONFIG }} vendor/sky_GKI.config
          
          make -j$(nproc --all) $ARGS LOCALVERSION=$CUSTOM_NAME Image


      - name: Get Build Info (Date & Version)
        run: |
          # 1. Generate a clean date string (e.g., 20231025-1430)
          echo "BUILD_DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

          # 2. Ask the kernel for its exact version string
          # cd $GITHUB_WORKSPACE
          cd $GITHUB_WORKSPACE/kernel_workspace
          # (Make sure the LOCALVERSION matches whatever you used in the compile step!)
          KERNEL_VER=$(make -s O=out ARCH=${{ env.ARCH }}  kernelrelease)
          echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV


      - name: Package into AnyKernel3 Flashable ZIP
        run: |
          cd $GITHUB_WORKSPACE
          # cd $GITHUB_WORKSPACE/kernel_workspace
          # Clone standard AnyKernel3 template
          git clone --depth=1 https://github.com/MrIceT/anykernel3_wild.git anykernel
          
          # Copy your freshly compiled Image into the AnyKernel folder
          cp $GITHUB_WORKSPACE/kernel_workspace/out/arch/arm64/boot/Image anykernel/
          
          # Zip everything up
          cd anykernel
          
          rm -rf .git

      #- name: Setup tmate session for debugging
       # uses: mxschmitt/action-tmate@v3

      
      - name: Upload Flashable Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: End-DroidSS-${{ env.KERNEL_VER }}-arrow-${{ env.BUILD_DATE }}
          path: anykernel/
